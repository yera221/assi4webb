<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 1 - Book a train ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/task1.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">

        <section class="card-form">
          <header class="card-form-head">
            <h1 class="h4 m-0">Book a train ticket</h1>
          </header>

          <form class="card-form-body ticket-body" action="#" method="get">
            <div class="trip-toggle mb-4" role="group" aria-label="Trip type">
              <input type="radio" class="btn-check" name="trip" id="oneway" value="oneway" checked>
              <label class="btn" for="oneway">One way</label>

              <input type="radio" class="btn-check" name="trip" id="round" value="round">
              <label class="btn" for="round">Round trip</label>
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="from" name="from"
                         placeholder="Astana" autocomplete="off" required>
                  <label for="from">From</label>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="to" name="to"
                         placeholder="Almaty" autocomplete="off" required>
                  <label for="to">To</label>
                </div>
              </div>
              <div class="col-12 col-md-4">
                <label for="departure" class="form-label">Departure</label>
                <input type="date" class="form-control" id="departure" name="departure" required>
              </div>
              <div class="col-12 col-md-4">
                <label for="return" class="form-label">Return</label>
                <input type="date" class="form-control" id="return" name="return">
              </div>
              <div class="col-12 col-md-4">
                <label for="passengers" class="form-label">Passengers</label>
                <select class="form-select" id="passengers" name="passengers" required>
                  <option value="1" selected>1 adult</option>
                  <option value="2">2 adults</option>
                  <option value="3">3 adults</option>
                  <option value="4">4 adults</option>
                  <option value="5">5 adults</option>
                  <option value="6">6 adults</option>
                </select>
              </div>
              <fieldset class="col-12">
                <legend>Carriage class</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                  <label class="form-check-label" for="seat">Seat</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked>
                  <label class="form-check-label" for="coupe">Coupé</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper">
                  <label class="form-check-label" for="sleeper">Sleeper</label>
                </div>
              </fieldset>
              <div class="col-12 col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <div class="input-group">
                  <span class="input-group-text" id="phone-code">+7</span>
                  <input type="tel" class="form-control" id="phone" name="phone"
                         placeholder="701 234 56 78" autocomplete="tel-national"
                         aria-describedby="phone-code" required>
                </div>
              </div>
              <div class="col-12 col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="name@example.com" autocomplete="email" required>
              </div>
              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
                  <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                </div>
                <div class="form-check mt-2">
                  <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
                  <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                </div>
              </div>
              <div class="col-12">
                <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2 gap-md-3 mt-2">
                  <button type="reset" class="btn btn-clear">Clear</button>
                  <button type="submit" class="btn btn-main btn-find">Find trains</button>
                </div>
              </div>

            </div>
          </form>
        </section>

      </div>
    </div>
  </main>
</body>
</html>
